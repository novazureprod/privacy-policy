<style>
  :root { --gold: #e0c58f; --ink: #050608; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: #f5f0e9; font-family: Poppins, system-ui, sans-serif; overflow: hidden; }

  .nav button { width: 52px; height: 52px; border-radius: 999px; border: 1px solid rgba(224,197,143,.45); background: rgba(10,14,24,.7); color: var(--gold); font-size: 22px; cursor: pointer; backdrop-filter: blur(8px); transition: transform .25s ease, background .25s ease, opacity .25s; }

  .hint { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: .25em; text-transform: uppercase; color: rgba(245,240,233,.45); z-index: 5; text-align: center; }

  .lightbox .frame { aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; background: #000; border: 1px solid rgba(224,197,143,.3); }
  .lightbox iframe { width: 100%; height: 100%; border: 0; }
  html.embed, html.embed body { background: transparent; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: rgba(224,197,143,.7); z-index: 4; pointer-events: none; transition: opacity .3s; }

faces.push({ type: "end" });

// ───────────── Dessin des pages (canvas) ─────────────
const PW = 1, PH = 1.12;                 // taille d'une page dans la scène

  g.addColorStop(0, "#28479e"); g.addColorStop(1, "#1a3378");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    let x = Math.random() * w, y = Math.random() * h;
    ctx.strokeStyle = `rgba(5,10,30,${0.08 + Math.random() * 0.12})`;
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let k = 0; k < 6; k++) { x += (Math.random() - 0.5) * 30; y += (Math.random() - 0.5) * 30; ctx.lineTo(x, y); }

function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function pill(ctx, text, cx, cy, size) {

// Zones cliquables, en coordonnées de texture (0..1, origine en haut à gauche)
const hits = {};

const catHover = CATS.map(() => 0), catHits = [];

    const mix = (a, b) => Math.round(a + (b - a) * e);
    x.fillStyle = `rgb(${mix(28, 168)},${mix(43, 133)},${mix(90, 63)})`;
    x.fillText(cat, cx + e * W * 0.012, y);

    catHits.push({ k, x0: (cx - tw / 2 - W * 0.07) / c.width, x1: (cx + tw / 2 + W * 0.04) / c.width, y0: (y - W * 0.05) / c.height, y1: (y + W * 0.02) / c.height });

}
function drawFace(i) {

// ───────────── Cuir brut de la couverture ─────────────
// Bruit à plusieurs échelles (grain du cuir) et plis → carte de relief → normales.

  ray.setFromCamera(ndc, camera);
  const meshes = sheets.flatMap((s) => s.g.children);
  return ray.intersectObjects(meshes, false)[0];
}
renderer.domElement.addEventListener("click", (e) => {
  const hit = pick(e); if (!hit) return;
  const face = hit.object.userData.face, uv = hit.uv;
  const u = face % 2 ? 1 - uv.x : uv.x, v = 1 - uv.y;
  const h = hits[face];
  if (h && u > h.x0 && u < h.x1 && v > h.y0 && v < h.y1) return void window.open(`https://www.youtube.com/watch?v=${h.id}`, "_blank", "noopener");
  if (face === 1) { const c = catAt(u, v); if (c >= 0) return goTo(catPage(c)); }
  go(face % 2 ? -1 : 1);
});
const catAt = (u, v) => { const c = catHits.find((r) => u > r.x0 && u < r.x1 && v > r.y0 && v < r.y1); return c ? c.k : -1; };
function catPage(k) { const f = faces.findIndex((x) => x.cat === CATS[k]); return f % 2 ? (f + 1) / 2 : f / 2; }
renderer.domElement.addEventListener("pointermove", (e) => {
  const hit = pick(e); let over = false; hoverCat = -1;
  if (hit) { const face = hit.object.userData.face, h = hits[face]; const u = face % 2 ? 1 - hit.uv.x : hit.uv.x, v = 1 - hit.uv.y; over = !!(h && u > h.x0 && u < h.x1 && v > h.y0 && v < h.y1); if (face === 1) { hoverCat = catAt(u, v); over = over || hoverCat >= 0; } }
  renderer.domElement.style.cursor = hit ? (over ? (hoverCat >= 0 ? "pointer" : "zoom-in") : "pointer") : "default";
});

// Cadrage : livre fermé centré sur la couverture, ouvert centré sur la double page.
let bookX = -PW / 2;
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h;
  const fit = (PW * 2.35) / (2 * Math.tan((camera.fov * Math.PI) / 360) * camera.aspect);
  const dist = Math.max(fit, (PH * 1.35) / (2 * Math.tan((camera.fov * Math.PI) / 360)));
  camera.position.set(0, -dist * 0.22, dist); camera.lookAt(0, 0.02, 0); camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

// ───────────── Démarrage ─────────────
// Démarrage rapide : polices, logo et premières vignettes en parallèle ; la couverture s'affiche
// tout de suite, les autres feuilles se construisent ensuite en arrière-plan.
const firstIds = VIDEOS.slice(0, 2).map((v) => v[0]);
await Promise.all([
  document.fonts.load("800 40px Poppins"), document.fonts.load("500 20px Poppins"), document.fonts.load("400 20px Poppins"),
  loadImg("logo-mark.webp").then((i) => (images.logo = i)),
  ...firstIds.map((id) => loadImg(`films/${id}.webp`).then((i) => (images[id] = i))),
]);
const restImages = Promise.all(VIDEOS.slice(2).map(async (v) => (images[v[0]] = await loadImg(`films/${v[0]}.webp`))));
paperBump = paperNormal();
backBoard.material = leatherMaps(512, Math.round((512 * CH) / CW), false);
for (let i = 0; i < 2; i++) makeSheet(i, drawFace(i * 2), drawFace(i * 2 + 1));
title.tex = sheets[0].g.children[1].material.map;
(async () => {
  await restImages;
  for (let i = 2; i < SHEETS; i++) {
    await new Promise((r) => setTimeout(r, 0)); // une feuille à la fois, sans bloquer l'affichage
    makeSheet(i, drawFace(i * 2), drawFace(i * 2 + 1));
    layout();
  }
})();
const bois = EMBED ? null : await loadImg("bois.avif");
if (bois) {
  const map = new THREE.Texture(bois); map.colorSpace = THREE.SRGBColorSpace; map.needsUpdate = true;
  const hc = document.createElement("canvas"); hc.width = Math.min(1024, bois.width); hc.height = Math.round(hc.width * bois.height / bois.width);
  const hx = hc.getContext("2d"); hx.filter = "grayscale(1)"; hx.drawImage(bois, 0, 0, hc.width, hc.height);
  const nrm = new THREE.CanvasTexture(heightToNormal(hc, 2.2));
  const tile = 3.2; // largeur d'un motif, en unités de scène
  [map, nrm].forEach((t) => { t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping; t.repeat.set(14 / tile, 10 / (tile * bois.height / bois.width)); t.anisotropy = 8; });
  table.material = new THREE.MeshStandardMaterial({ map, normalMap: nrm, normalScale: new THREE.Vector2(0.5, 0.5), roughness: 0.6, metalness: 0, envMapIntensity: 0.3, color: 0x8c8c8c });
}
resize(); layout(); updateUi();
document.getElementById("loading").style.opacity = 0; window.__ready = performance.now();

const clock = new THREE.Clock();
let lightOpen = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  let moving = false;
  for (const s of sheets) if (s.t < 1) {
    moving = true;
    if (s.delay > 0) { s.delay -= dt; continue; }
    s.t = Math.min(1, s.t + dt / s.dur); s.p = s.from + (s.to - s.from) * ease(s.t);
  }
  let catChanged = false;
  catHover.forEach((v, k) => { const t = k === hoverCat ? 1 : 0; if (v !== t) { catHover[k] = t > v ? Math.min(1, v + dt * 5) : Math.max(0, v - dt * 4); catChanged = true; } });
  if (catChanged) drawCats();
  lightOpen += ((page > 0 ? 1 : 0) - lightOpen) * Math.min(1, dt * 1.5);
  key.intensity = 2.4 - 1.25 * lightOpen; fill.intensity = 0.6 - 0.35 * lightOpen; scene.environmentIntensity = 0.35 - 0.1 * lightOpen;
  if (moving) layout();
  const targetX = page === 0 ? -PW / 2 : page >= SHEETS - 1 && sheets[SHEETS - 1].p > 0.99 ? PW / 2 : 0;
  bookX += (targetX - bookX) * Math.min(1, dt * 3);
  book.position.x = bookX;
  book.rotation.x = -0.04 + Math.sin(clock.elapsedTime * 0.4) * 0.004;
  if (EMBED) { book.position.z = Math.sin(clock.elapsedTime * 0.7) * 0.012; book.rotation.y = Math.sin(clock.elapsedTime * 0.35) * 0.012; }
  const sw = (clock.elapsedTime % 7) / 7; // un passage toutes les 7 secondes
  sweep.position.x = -2.4 + sw * 4.8; sweep.position.y = 0.5 - sw * 0.9; sweep.intensity = Math.sin(sw * Math.PI) * (2.6 - 1 * lightOpen);
  renderer.render(scene, camera);
});
</script>
